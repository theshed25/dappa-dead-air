<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>DAPPA — Old Skool</title><style>*{box-sizing:border-box}body{margin:0;background:#171b19;color:#fff;font:700 16px system-ui;overflow:hidden;touch-action:none}canvas{width:100vw;height:100dvh;display:block}#hud{position:fixed;top:8px;left:12px;text-shadow:2px 2px #111}#menu{position:fixed;inset:0;background:#171b19df;display:grid;place-items:center;text-align:center;z-index:5}#panel{background:#e8d8af;color:#262725;padding:24px;border:5px solid #282c29;border-radius:14px}button{touch-action:none;border:3px solid #222;border-radius:14px;background:#e7d6ae;font-size:24px;font-weight:900}#start{padding:12px 28px;background:#b9d28e}#controls{position:fixed;bottom:max(15px,env(safe-area-inset-bottom));left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none}.group{display:flex;gap:12px}.key{pointer-events:auto;width:65px;height:65px;opacity:.56}#jump{background:#a5c8d5}#attack{background:#e7a4a0}</style></head><body><canvas id="game" width="960" height="540"></canvas><div id="hud">DAPPA: DEAD AIR · OLD SKOOL <span id="status"></span></div><div id="controls"><div class="group"><button class="key" data-k="left">◀</button><button class="key" data-k="right">▶</button></div><div class="group"><button class="key" data-k="attack" id="attack">✎</button><button class="key" data-k="jump" id="jump">▲</button></div></div><div id="menu"><div id="panel"><h1>DAPPA: DEAD AIR</h1><h2>01 — OLD SKOOL</h2><p>Get Avon back to The Shed.</p><button id="start">START LEVEL</button></div></div><script>(()=>{const c=document.querySelector('canvas'),g=c.getContext('2d'),menu=document.querySelector('#menu'),start=document.querySelector('#start'),status=document.querySelector('#status'),K={left:0,right:0,jump:0,attack:0},P={x:70,y:330,vx:0,vy:0,w:34,h:62,on:0,dir:1,atk:0,inv:0};let playing=false,cam=0,frame=0,coins=0,hp=3,checkpoint=70;const ground=460,platforms=[{x:0,y:460,w:680},{x:750,y:460,w:510},{x:1330,y:460,w:620},{x:2020,y:460,w:1280},...[[320,370,130],[590,300,120],[900,360,125],[1100,290,130],[1450,350,130],[1750,310,130],[2180,355,140],[2510,300,150],[2840,350,140]].map(([x,y,w])=>({x,y,w}))],enemies=[450,930,1500,1810,2250,2700,3000].map(x=>({x,y:425,live:true})),items=[370,620,950,1160,1490,1790,2260,2580,2910].map((x,i)=>({x,y:i%2?260:330,got:false}));function reset(){Object.assign(P,{x:checkpoint,y:310,vx:0,vy:0,inv:65});hp=3}function begin(){playing=true;menu.style.display='none';reset()}start.onclick=begin;document.querySelectorAll('[data-k]').forEach(b=>{let k=b.dataset.k;b.onpointerdown=e=>{e.preventDefault();b.setPointerCapture(e.pointerId);K[k]=1};for(let ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>K[k]=0)});const map={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'jump',Space:'jump',KeyW:'jump',KeyJ:'attack',KeyK:'attack'};onkeydown=e=>{if(map[e.code]){e.preventDefault();K[map[e.code]]=1}if(e.code==='Enter'&&!playing)begin()};onkeyup=e=>{if(map[e.code])K[map[e.code]]=0};function hit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}function damage(){if(P.inv)return;hp--;P.inv=70;P.vy=-7;if(hp<=0)reset()}function update(){frame++;if(!playing)return;P.vx=4.5*(K.right-K.left);if(P.vx)P.dir=Math.sign(P.vx);if(K.jump&&P.on){P.vy=-13.5;P.on=0}if(K.attack&&P.atk<=0)P.atk=23;P.atk=Math.max(0,P.atk-1);P.inv=Math.max(0,P.inv-1);P.x=Math.max(0,Math.min(3250,P.x+P.vx));let bottom=P.y+P.h;P.vy=Math.min(14,P.vy+.65);P.y+=P.vy;P.on=0;for(const a of platforms)if(P.x+P.w>a.x&&P.x<a.x+a.w&&bottom<=a.y+10&&P.y+P.h>=a.y&&P.vy>=0){P.y=a.y-P.h;P.vy=0;P.on=1}if(P.y>600)damage();for(const e of enemies)if(e.live){let q={x:e.x,y:e.y,w:34,h:35};if(P.atk>6&&hit({x:P.x+(P.dir>0?26:-46),y:P.y+14,w:55,h:40},q))e.live=false;else if(hit(P,q)){if(P.vy>1&&bottom<e.y+12){e.live=false;P.vy=-9}else damage()}}for(const a of items)if(!a.got&&Math.abs(P.x-a.x)<34&&Math.abs(P.y-a.y)<55){a.got=true;coins++}if(P.x>1700)checkpoint=1700;if(P.x>3170){playing=false;menu.style.display='grid';document.querySelector('#panel h2').textContent='OLD SKOOL COMPLETE!';document.querySelector('#panel p').textContent='One step closer to The Shed.';start.textContent='PLAY AGAIN';checkpoint=70;coins=0;enemies.forEach(e=>e.live=true);items.forEach(a=>a.got=false)}cam=Math.max(0,Math.min(2340,P.x-390));status.textContent=' · ♥ '+hp+' · ✦ '+coins+'/9'}function box(x,y,w,h,col){g.fillStyle=col;g.fillRect(x,y,w,h)}function draw(){box(0,0,960,540,'#c6b998');for(let i=0;i<23;i++){let x=i*190-cam*.2;box(x,175+i%3*14,135,290,'#9aa99a');box(x+20,220+i%3*14,30,43,'#657d78');box(x+77,220+i%3*14,30,43,'#657d78')}box(0,445,960,95,'#a69d7f');g.save();g.translate(-cam,0);for(const a of platforms){box(a.x,a.y,a.w,90,'#454d43');box(a.x,a.y,a.w,12,'#82906c')}for(const a of items)if(!a.got){g.beginPath();g.fillStyle='#f8d16e';g.arc(a.x,a.y+Math.sin(frame/12)*4,11,0,7);g.fill()}for(const e of enemies)if(e.live){box(e.x,e.y,34,35,'#97636a');box(e.x+5,e.y+7,8,9,'white');box(e.x+21,e.y+7,8,9,'white');box(e.x+9,e.y+10,4,4,'#222');box(e.x+25,e.y+10,4,4,'#222')}box(1710,365,10,95,'#bfa56d');box(1720,365,75,32,'#e8d8af');box(3180,340,12,120,'#222');box(3192,340,85,38,'#e8d8af');g.fillStyle='#222';g.font='bold 18px system-ui';g.fillText('EXIT',3207,366);if(P.inv%8<4){g.save();g.translate(P.x+17,P.y);g.scale(P.dir,1);box(-14,25,28,34,'#9e6267');box(-17,57,17,9,'#332d2d');box(3,57,17,9,'#332d2d');g.beginPath();g.fillStyle='#edc19b';g.arc(0,15,18,0,7);g.fill();box(-18,1,36,9,'#834e59');box(-12,-8,24,14,'#834e59');box(5,12,5,5,'#222');if(P.atk){box(12,24,52,7,'#e4d5a7');box(60,18,11,19,'#c16b74')}g.restore()}g.restore()}function loop(){update();draw();requestAnimationFrame(loop)}loop()})();</script></body></html>
